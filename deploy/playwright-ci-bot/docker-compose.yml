name: playwright-ci-bot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  bot:
    build:
      context: ../..
      dockerfile: deploy/playwright-ci-bot/Dockerfile
    env_file:
      - ../../.env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.25
    mem_limit: 128m
    stop_grace_period: 30s
    logging: *default-logging
