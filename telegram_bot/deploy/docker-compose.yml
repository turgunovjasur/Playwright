name: playwright-ci-bot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  report-publisher:
    image: python:3.12-slim
    user: "101:101"
    command: ["python", "-B", "-u", "/app/report_store.py"]
    network_mode: none
    read_only: true
    restart: unless-stopped
    volumes:
      - ./report_store.py:/app/report_store.py:ro
      - ../../report-storage:/reports
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging: *default-logging

  bot:
    build:
      context: ../..
      dockerfile: telegram_bot/deploy/Dockerfile
    env_file:
      - ../../.env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.25
    mem_limit: 128m
    stop_grace_period: 30s
    logging: *default-logging

  reports:
    image: nginxinc/nginx-unprivileged:stable-alpine
    user: "101:101"
    restart: unless-stopped
    read_only: true
    ports:
      - "${ALLURE_BIND_ADDRESS:-127.0.0.1}:18086:8080"
    volumes:
      - ./reports-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../report-storage:/reports
      - ../../report-auth:/auth:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
