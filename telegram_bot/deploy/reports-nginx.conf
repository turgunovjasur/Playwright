server {
    listen 8080;
    server_name _;
    root /reports;
    access_log off;
    client_body_temp_path /reports/.incoming;
    add_header Content-Security-Policy "sandbox allow-scripts allow-downloads; connect-src data: blob:; frame-src blob: data:; form-action 'none'; base-uri 'none'" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~ "^/upload/(?<report>[0-9]+-[0-9]+\.html)$" {
        limit_except PUT { deny all; }
        auth_basic "CI publish";
        auth_basic_user_file /auth/publisher;
        client_max_body_size 1g;
        alias /reports/$report;
        dav_methods PUT;
        dav_access user:rw;
    }

    location ~ "^/[0-9]+-[0-9]+\.html$" {
        limit_except GET { deny all; }
        auth_basic "Playwright Allure";
        auth_basic_user_file /auth/viewers;
    }

    location / { return 404; }
}
