server {
    listen 8080;
    server_name _;
    root /reports;
    access_log off;
    client_body_temp_path /reports/.incoming;
    add_header Content-Security-Policy "sandbox allow-scripts allow-downloads; connect-src data: blob:; frame-src blob: data:; form-action 'none'; base-uri 'none'" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~ "^/upload/(?<report>[0-9]+-[0-9]+\.html)$" {
        limit_except PUT { deny all; }
        auth_basic "CI publish";
        auth_basic_user_file /auth/publisher;
        client_max_body_size 4g;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Authorization "";
        proxy_set_header Connection close;
        proxy_pass http://unix:/reports/.incoming/publisher.sock;
    }

    location ~ "^/[0-9]+-[0-9]+\.html$" {
        if (-f $request_filename.view) { rewrite ^ /_report-viewer.html last; }
        limit_except GET { deny all; }
        auth_basic "Playwright Allure";
        auth_basic_user_file /auth/viewers;
    }

    # Only this fixed shell can read same-origin ranges. Uploaded HTML always
    # retains the sandbox policy, including when its URL is opened directly.
    location = /_report-viewer.html {
        internal;
        alias /etc/nginx/report-viewer.html;
        limit_except GET { deny all; }
        auth_basic "Playwright Allure";
        auth_basic_user_file /auth/viewers;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location ~ "^/[0-9]+-[0-9]+\.html\.view$" {
        default_type text/html;
        limit_except GET { deny all; }
        auth_basic "Playwright Allure";
        auth_basic_user_file /auth/viewers;
    }

    location ~ "^/packed/(?<archive>[0-9]+-[0-9]+\.html)$" {
        alias /reports/$archive;
        limit_except GET { deny all; }
        auth_basic "Playwright Allure";
        auth_basic_user_file /auth/viewers;
    }

    location / { return 404; }
}
