[pytest]
testpaths = setup/test_0_setup_runner.py
pythonpath = ../..
python_files = test_*.py
addopts = -v --tb=short --confcutdir=tests/api -p no:playwright --alluredir=test-results/api/allure-results --clean-alluredir
markers =
    api_setup: sequential HTTP setup chain
asyncio_default_fixture_loop_scope = function
