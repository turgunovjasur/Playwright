name: Hourly Smoke and Forms Tests

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - forms
      server:
        description: Server
        required: true
        default: smartup
        type: choice
        options:
          - smartup
          - app3
      telegram_progress_message_id:
        description: Existing Telegram progress message id
        required: false
        default: ""
        type: string

concurrency:
  group: daily-smoke-tests
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke
    if: ${{ github.event_name == 'schedule' || inputs.suite == 'smoke' }}
    uses: ./.github/workflows/run-smartup-suite.yml
    with:
      target: setup-group-0
      server_key: ${{ inputs.server || 'smartup' }}
      telegram_progress_message_id: ${{ inputs.suite == 'smoke' && inputs.telegram_progress_message_id || '' }}
      artifact_name: smoke-test-results
    secrets: inherit

  forms:
    name: Forms
    needs: smoke
    if: ${{ always() && (github.event_name == 'schedule' || inputs.suite == 'forms') }}
    uses: ./.github/workflows/run-smartup-suite.yml
    with:
      target: forms
      server_key: ${{ inputs.server || 'smartup' }}
      telegram_progress_message_id: ${{ inputs.suite == 'forms' && inputs.telegram_progress_message_id || '' }}
      artifact_name: forms-test-results
    secrets: inherit
